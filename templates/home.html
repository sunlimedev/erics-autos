<!DOCTYPE html>
<html lang="en">
<head>
    <!-- boilerplate -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="icon" type="image/png" sizes="96x96" href="{{ url_for('static', filename='favicon-96x96.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <!-- page title -->
    <title>Eric's Garage</title>
</head>
<body class="min-h-dvh">
    <!-- full page -->
    <div class="flex flex-col bg-blue-900">
        <!-- header -->
        <div class="sticky top-0 border-b-2 border-gray-300">
            <!-- header text -->
            <div class="p-4 font-bold text-gray-300 text-3xl">
                Eric's Garage
            </div>
        </div>
        <!-- button container -->
        <div class="flex flex-col flex-1 p-3 space-y-3">
            <!-- buttons -->
            <a href="/hyundai" class="w-100 h-50 rounded-lg">
                <img src="{{ url_for('static', filename='hyundai_pretty.png') }}" alt="Hyundai Button" class="w-100 h-50 rounded-lg object-cover object-center">
            </a>
            <a href="/honda" class="w-100 h-50 rounded-lg">
                <img src="{{ url_for('static', filename='honda_pretty.png') }}" alt="Honda Button" class="w-100 h-50 rounded-lg object-cover object-center">
            </a>
            <a href="/porsche" class="w-100 h-50 rounded-lg">
                <img src="{{ url_for('static', filename='porsche_pretty.png') }}" alt="Porsche Button" class="w-100 h-50 rounded-lg object-cover object-center">
            </a>
        </div>
    </div>
</body>
</html>

{% extends "_base.html" %}

{% block title %}My Garage{% endblock %}

{% block content %}
    <div class="space-y-3">
        <!-- text -->
        <div class="flex justify-center text-3xl font-semibold text-black">
            Eric's Garage
        </div>
        {% include '_alert.html' %}
        <!-- hyundai button -->
        <a href="{{ url_for('hyundai') }}" class="block drop-shadow-xl/25 w-full aspect-2/1 rounded-lg overflow-hidden">
            <img src="{{ hyundai_url }}" alt="Hyundai Button" class="w-full h-full object-cover object-center scale-101">
        </a>
        <!-- honda button -->
        <a href="{{ url_for('honda') }}" class="block drop-shadow-xl/25 w-full aspect-2/1 rounded-lg overflow-hidden">
            <img src="{{ honda_url }}" alt="Honda Button" class="w-full h-full object-cover object-center scale-101">
        </a>
        <!-- porsche button -->
        <a href="{{ url_for('porsche') }}" class="block drop-shadow-xl/25 w-full aspect-2/1 rounded-lg overflow-hidden">
            <img src="{{ porsche_url }}" alt="Porsche Button" class="w-full h-full object-cover object-center scale-101">
        </a>
    </div>
{% endblock %}

{% block script %}
    <!-- alert script -->
    {% include '_drop_alert.html' %}
{% endblock %}

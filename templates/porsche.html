{% extends "_base.html" %}

{% block title %}918 Cayman GT4 RS{% endblock %}

{% block content %}
    <div class="space-y-3">
        <!-- logo -->
        <div class="flex flex-col items-center">
            <div class="w-xs">
                <img src="{{ url_for('static', filename='logo/porsche.svg') }}" alt="Logo">
            </div>
        </div>
        <!-- alert -->
        {% include '_alert.html' %}
        <!-- car data -->
        {% include '_stats_table.html' %}
        <!-- log data -->
        <a href="{{ url_for('porsche_log_data') }}" class="block text-center bg-blue-900 hover:bg-blue-950 text-lg text-white font-medium p-3 rounded-lg transition shadow-md hover:shadow-lg cursor-pointer">
            Log Data
        </a>
        <!-- deep insights -->
        <a href="{{ url_for('porsche') }}" class="block text-center bg-blue-900 hover:bg-blue-950 text-lg text-white font-medium p-3 rounded-lg transition shadow-md hover:shadow-lg cursor-pointer">
            View Deep Insights
        </a>
    </div>
{% endblock %}

{% block script %}
    <!-- alert script -->
    {% include '_drop_alert.html' %}
{% endblock %}
